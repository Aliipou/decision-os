[package]
name = "dos-authority"
version = "0.1.0"
description = "Decision OS authority: signed capabilities, attenuation, non-amplifying delegation, builtin PDP. No I/O, no clock. Capability model credited to sluicegate."
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
dos-core = { path = "../dos-core" }
# Same pin as dos-core (capability ids are SHA-256 of the signed message).
sha2 = { version = "=0.10.9", default-features = false }

[dev-dependencies]
# Already a dev-dependency of dos-core (offline registry).
proptest = "1.12.0"
