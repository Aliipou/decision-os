[package]
name = "dos-cli"
version = "0.1.0"
description = "The decision-os binary: gateway proxy with policy and signed audit, key generation, audit verification."
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "decision-os"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
dos-core = { path = "../dos-core" }
dos-audit = { path = "../dos-audit" }
dos-decision = { path = "../dos-decision" }
dos-exec = { path = "../dos-exec" }
serde_json = "1"
sha2 = { version = "=0.10.9", default-features = false }
getrandom = "0.4"
