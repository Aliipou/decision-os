[package]
name = "dos-conformance"
version = "0.1.0"
description = "Runs conformance vectors against any implementation's adapter and diffs the results."
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "dos-conformance"
path = "src/main.rs"

# The deliberately broken adapter lives inside this test binary (see design note);
# it needs its own main, so the libtest harness is off.
[[test]]
name = "adapter_failures"
path = "tests/adapter_failures.rs"
harness = false

[dependencies]

[dev-dependencies]
# Differential oracle for the strict parser, and an independent JSON reader for the
# test adapter. Never a runtime dependency (see design/conformance-runner.md).
serde_json = "1"
