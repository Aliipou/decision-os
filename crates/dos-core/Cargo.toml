[package]
name = "dos-core"
version = "0.1.0"
description = "Decision OS trusted core: canonical form, fingerprint, verdict lattice, signatures. No I/O, no clock."
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
# Ed25519 (sign.rs). Exact versions: see design/sign.md. No default features:
# no std, no RNG; "zeroize" wipes secret keys on drop; "fast" = precomputed tables.
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["zeroize", "fast"] }
curve25519-dalek = { version = "=4.1.3", default-features = false }
sha2 = { version = "=0.10.9", default-features = false }
zeroize = { version = "1.8", default-features = false }

[dev-dependencies]
proptest = "1.11"
serde_json = "1"
