[package]
name = "dos-decision"
version = "0.1.0"
description = "Decision OS gateway policy: TOML rules, profiles, learned choices, and the policy PDP verdict."
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
dos-core = { path = "../dos-core" }
# Parse only: no "display" feature (toml_writer is not needed).
toml_edit = { version = "=0.25.21", default-features = false, features = ["parse"] }
sha2 = { version = "=0.10.9", default-features = false }

[dev-dependencies]
serde_json = "1"
