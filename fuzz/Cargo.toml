[package]
name = "dos-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
dos-core = { path = "../crates/dos-core" }
dos-audit = { path = "../crates/dos-audit" }

# Not a member of the main workspace: it needs nightly and libFuzzer.
[workspace]
members = ["."]

[[bin]]
name = "canon"
path = "fuzz_targets/canon.rs"
test = false
doc = false
bench = false

[[bin]]
name = "audit"
path = "fuzz_targets/audit.rs"
test = false
doc = false
bench = false
